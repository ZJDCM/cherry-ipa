name: Build unsigned IPA (TrollStore)

# 免费云 Mac 编译 Cherry Studio iOS 未签名 IPA，供 TrollStore 安装。
# 用法：在你自己的公开仓库放 .github/workflows/build-ios-ipa.yml
# → Actions 页手动 Run workflow → 跑完后在该次运行页面下载 Artifact（zip 内含 .ipa）。

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "cherry-studio-app 的分支或 tag（如 v0.1.0）"
        required: false
        default: "main"
      deployment_target:
        description: "iOS 最低部署版本（官方 17.0；老设备巨魔可试 16.4，编译可能失败）"
        required: false
        default: "17.0"

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "12.2.1"

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 170

    steps:
      - name: Select latest stable Xcode
        run: |
          ls /Applications | grep Xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcrun simctl list runtimes | head -5 || true

      - name: Checkout cherry-studio-app
        uses: actions/checkout@v5
        with:
          repository: CherryHQ/cherry-studio-app
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: "Optional: patch iOS deployment target"
        if: ${{ inputs.deployment_target != '17.0' }}
        env:
          DT: ${{ inputs.deployment_target }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "app.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.expo.plugins = j.expo.plugins.map((x) => {
              if (Array.isArray(x) && x[0] === "expo-build-properties") {
                x[1].ios.deploymentTarget = process.env.DT;
              }
              return x;
            });
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
          '
          grep -n "deploymentTarget" app.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local packages (EAS post-install equivalent)
        run: pnpm packages:build

      - name: Expo prebuild (generate ios/ project)
        env:
          PROFILE: production
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods install
        run: pod install --project-directory=ios

      - name: Build unsigned .app (Release / iphoneos)
        env:
          SENTRY_SUPPRESS_UPLOADING_NATIVE_SYMBOLS: "true"
        run: |
          set -euxo pipefail
          WS="$(ls -d ios/*.xcworkspace 2>/dev/null | head -1)"
          if [ -z "$WS" ]; then WS="$(ls -d ios/*.xcodeproj 2>/dev/null | head -1)"; fi
          SCHEME="$(basename "$WS" | sed 's/\.[^.]*$//')"
          echo "workspace=$WS scheme=$SCHEME"
          ls -d "$WS"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -eux
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "App: $APP_PATH"
          rm -rf Payload CherryStudio-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry CherryStudio-unsigned.ipa Payload
          shasum -a 256 CherryStudio-unsigned.ipa | tee SHA256SUMS.txt
          ls -lh CherryStudio-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CherryStudio-unsigned-ipa
          path: |
            CherryStudio-unsigned.ipa
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

# rev: 4 (fix workspace detection with ls -d)
