name: Patch IPA (minOS 16 + weak-link iOS17 symbols)

on:
  workflow_dispatch:
    inputs:
      src_tag:
        description: "源 Release tag（含 17.0 版 IPA）"
        required: true
        default: "trollstore-ipa-20260924-082820"
      min_ios:
        required: true
        default: "16.0"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Download source IPA
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euxo pipefail
          gh release download "${{ inputs.src_tag }}" -R ZJDCM/cherry-ipa -p "*.ipa" -D in
          ls -la in
      - name: Patch Mach-O (minOS + weak undefined symbols) and Info.plist
        env: { MIN_IOS: "${{ inputs.min_ios }}" }
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os, struct, plistlib, zipfile, shutil
          minv = os.environ["MIN_IOS"]
          def enc(v):
              a,b,c=(list(map(int,v.split(".")))+[0,0])[:3]
              return (a<<16)|(b<<8)|c
          target = enc(minv)

          def macho_offsets(d):
              # 返回每个架构 slice 的起始偏移
              if d[:4]==b'\xcf\xfa\xed\xfe': return [0]
              if d[:4]==b'\xca\xfe\xba\xbe':
                  n=struct.unpack('>I',d[4:8])[0]
                  return [struct.unpack('>I',d[8+i*20+8:8+i*20+12])[0] for i in range(n)]
              if d[:4]==b'\xbe\xba\xfe\xca':
                  n=struct.unpack('<I',d[4:8])[0]
                  return [struct.unpack('<I',d[8+i*20+8:8+i*20+12])[0] for i in range(n)]
              return None

          def patch_macho(path):
              d=bytearray(open(path,"rb").read())
              offs=macho_offsets(d)
              if offs is None: return None
              changed=False
              for off in offs:
                  if d[off:off+4]!=b'\xcf\xfa\xed\xfe': continue
                  n=struct.unpack('<I',d[off+16:off+20])[0]; p=off+32; symtab=None
                  for _ in range(n):
                      cmd,cs=struct.unpack('<II',d[p:p+8])
                      if cmd==0x32:  # LC_BUILD_VERSION
                          cur=struct.unpack('<I',d[p+12:p+16])[0]
                          if cur>target:
                              d[p+12:p+16]=struct.pack('<I',target); changed=True
                      if cmd==0x02:  # LC_SYMTAB
                          symtab=(off,)+struct.unpack('<IIII',d[p+8:p+24])
                      p+=cs
                  if symtab:
                      soff,symoff,nsyms,stroff,strsize=symtab
                      base=soff+symoff
                      for i in range(nsyms):
                          b=base+i*16
                          n_strx,n_type,n_sect,n_desc,n_value=struct.unpack('<IBBHQ',d[b:b+16])
                          if (n_type & 0x0e)==0 and (n_type & 0x01)!=0 and not (n_type & 0x40):
                              # 未定义的外部符号 -> 设为弱引用，缺失时绑定为 0 而非报错
                              d[b+4:b+5]=bytes([n_type|0x40]); changed=True
              if changed:
                  open(path,"wb").write(d)
              return changed

          src="in/"+[f for f in os.listdir("in") if f.endswith(".ipa")][0]
          work="work"; shutil.rmtree(work,ignore_errors=True)
          zipfile.ZipFile(src).extractall(work)

          n=0
          for root,_,files in os.walk(work):
              for fn in files:
                  fp=os.path.join(root,fn)
                  if fn=="CherryStudio" or fn.endswith(".dylib") or root.endswith(".appex"):
                      try:
                          if patch_macho(fp): print("patched macho:", fp); n+=1
                      except Exception as e: print("skip", fp, e)
          print("macho patched:", n)

          for root,_,files in os.walk(work):
              for fn in files:
                  if fn=="Info.plist":
                      fp=os.path.join(root,fn)
                      try:
                          raw=open(fp,"rb").read()
                          fmt=plistlib.FMT_BINARY if raw[:6]==b"bplist" else plistlib.FMT_XML
                          dd=plistlib.loads(raw); ch=False
                          for k in ("MinimumOSVersion","LSMinimumSystemVersion"):
                              if k in dd:
                                  try:
                                      if enc(str(dd[k]))>target: dd[k]=minv; ch=True
                                  except Exception: pass
                          if ch:
                              open(fp,"wb").write(plistlib.dumps(dd,fmt=fmt)); print("plist:", fp, "->", minv)
                      except Exception: pass

          shutil.make_archive("pkg","zip",work); os.replace("pkg.zip","CherryStudio-unsigned-ios16.ipa")
          print("built", os.path.getsize("CherryStudio-unsigned-ios16.ipa"))
          PY
          sha256sum CherryStudio-unsigned-ios16.ipa | tee SHA256SUMS-ios16.txt
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euxo pipefail
          tag="trollstore-ipa-ios16-weaklink-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" -R ZJDCM/cherry-ipa \
            --title "Cherry Studio IPA (iOS16 + weak-link) $tag" \
            --notes "minOS 16.0 and iOS17-only symbols weak-linked for iOS 16.6.1 TrollStore." \
            CherryStudio-unsigned-ios16.ipa SHA256SUMS-ios16.txt
          echo "TAG=$tag"
